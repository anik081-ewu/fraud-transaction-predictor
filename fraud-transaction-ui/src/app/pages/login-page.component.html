<section class="auth-page">
  <div class="auth-card">
    <div class="auth-heading">
      <span class="eyebrow">Anomaly Model Comparison</span>
      <h2>Welcome back</h2>
      <p>Sign in to manage datasets, compare models, and review suspicious transactions.</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="Enter your username"
        [(ngModel)]="username"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        [(ngModel)]="password"
        required
      />

      <p class="auth-message" *ngIf="message()">{{ message() }}</p>

      <button type="submit" [disabled]="submitting() || loginForm.invalid">
        {{ submitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch">
      Do not have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</section>
