spring.application.name=fraud-transaction-detector
server.port = 8080
# --- Fraud ML service ---
fraud.ml.base-url=http://localhost:8000
fraud.ml.auto-train-after-upload=false

# --- Authentication ---
auth.jwt.secret=${AUTH_JWT_SECRET:change-me-demo-secret}
auth.jwt.expiry-seconds=${AUTH_JWT_EXPIRY_SECONDS:3600}

# --- Browser client ---
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# --- Database ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=fraud-transaction-detector;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=admin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection pool.
# The default of 10 is too small here: bulk CSV upload, feature materialisation, dataset
# export and model training all hold connections for long stretches on background threads,
# while the UI polls at the same time. Once every connection is held, unrelated requests
# queue for 30s and time out — the pool becomes the bottleneck rather than the database.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
# Logs a stack trace when a connection is held longer than this, so a genuine leak is
# identifiable rather than showing up only as pool exhaustion.
spring.datasource.hikari.leak-detection-threshold=120000

# Keep schema managed by SQL (your DB is already created)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload limits (tune as needed)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
